<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HRMS</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        .hint { margin-top: 20px; color: #94a3b8; font-size: 14px; line-height: 1.6; }
        #app { display: none; }
    </style>
</head>
<body>
    <div id="login">
        <div class="card">
            <h1>🏢 HRMS Login</h1>
            <input type="text" id="username" value="admin" placeholder="Username">
            <input type="password" id="password" value="admin123" placeholder="Password">
            <button onclick="dologin()">Sign In</button>
            <div class="hint">
                <strong>Admin Access</strong><br>
                Username: admin<br>
                Password: admin123
            </div>
        </div>
    </div>

    <div id="app">
        <div class="card" style="width: 500px;">
            <h1>✅ Welcome Admin!</h1>
            <p style="margin: 20px 0;">System is working! Your data saves automatically.</p>
            <h3>📊 Dashboard</h3>
            <p>Total Employees: <strong id="count-emp">0</strong></p>
            <button onclick="addEmp()">+ Add Test Employee</button>
            <button style="background: #374151;" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <script>
        // Function name matches what the button calls — FIXED!
        function dologin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if (u === 'admin' && p === 'admin123') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadEmp();
            } else {
                alert('❌ Wrong credentials!\n\nUse:\nUsername: admin\nPassword: admin123');
            }
        }

        function logout() {
            document.getElementById('login').style.display = 'block';
            document.getElementById('app').style.display = 'none';
        }

        function loadEmp() {
            const list = JSON.parse(localStorage.getItem('emp') || '[]');
            document.getElementById('count-emp').textContent = list.length;
        }

        function addEmp() {
            const list = JSON.parse(localStorage.getItem('emp') || '[]');
            list.push({ name: 'Employee ' + (list.length + 1) });
            localStorage.setItem('emp', JSON.stringify(list));
            loadEmp();
            alert('✅ Employee added! Data is saved.');
        }
    </script>
</body>
</html>
